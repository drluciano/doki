<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="960" viewBox="0 0 1510 960" role="img" aria-labelledby="title"><title id="title">Doki proposed 02-review.svg static concept with sample data</title><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1510" height="960" rx="0" fill="#FAF7F2" stroke="none"/><text x="32" y="40" font-size="15" fill="#7354A3" font-weight="700">DOKI / DESIGN CONCEPT 01</text><text x="32" y="76" font-size="28" fill="#272335" font-weight="700">Two devices made progress.</text><text x="32" y="104" font-size="15" fill="#655D70" font-weight="400">Incoming save review / preserve both continuations, make one deliberate choice</text><rect x="28" y="132" width="990" height="746" rx="24" fill="#EEE9E3" stroke="none"/><rect x="38" y="142" width="970" height="726" rx="18" fill="#FAF7F2" stroke="none"/><rect x="1052" y="132" width="430" height="746" rx="30" fill="#302A3B" stroke="none"/><rect x="1064" y="144" width="406" height="722" rx="23" fill="#FAF7F2" stroke="none"/><text x="60" y="183" font-size="23" fill="#7354A3" font-weight="700">◉ doki</text><text x="60" y="229" font-size="16" fill="#7354A3" font-weight="700">Library</text><text x="60" y="268" font-size="16" fill="#272335" font-weight="400">Reviews  1</text><text x="60" y="307" font-size="16" fill="#272335" font-weight="400">Devices</text><text x="60" y="813" font-size="15" fill="#655D70" font-weight="400">Settings</text><text x="1084" y="182" font-size="22" fill="#7354A3" font-weight="700">doki</text><text x="1350" y="181" font-size="13" fill="#655D70" font-weight="400">Practice</text><rect x="1076" y="798" width="382" height="54" rx="15" fill="#EEE8F4" stroke="none"/><text x="1090" y="831" font-size="15" fill="#7354A3" font-weight="600">Library</text><text x="1210" y="831" font-size="15" fill="#7354A3" font-weight="600">Reviews · 1</text><text x="1352" y="831" font-size="15" fill="#7354A3" font-weight="600">Devices</text><text x="32" y="909" font-size="16" fill="#7354A3" font-weight="700">PROPOSED • sample data • static mockup • no production functionality</text><text x="32" y="936" font-size="14" fill="#655D70" font-weight="400">Desktop concept + compact 406dp concept. Real device support and owner acceptance remain pending.</text><text x="244" y="191" font-size="28" fill="#272335" font-weight="700">Moonlit Meadow</text><text x="244" y="221" font-size="16" fill="#655D70" font-weight="400">Both saves continue from checkpoint “Before the hill”.</text><rect x="244" y="250" width="356" height="265" rx="18" fill="#FFFFFF" stroke="none"/><rect x="262" y="268" width="179.4" height="30" rx="15" fill="#E2EFE8" stroke="none"/><text x="274" y="288" font-size="13" fill="#285343" font-weight="600">Current playable save</text><text x="262" y="330" font-size="23" fill="#272335" font-weight="700">This handheld</text><text x="262" y="363" font-size="16" fill="#655D70" font-weight="400">Oct 17 · 8:14 PM</text><text x="262" y="395" font-size="15" fill="#655D70" font-weight="400">Save bundle · 2 files · 128 KB</text><text x="262" y="429" font-size="15" fill="#285343" font-weight="600">Copy verified</text><text x="262" y="468" font-size="14" fill="#655D70" font-weight="400">Progress details unavailable</text><rect x="615" y="250" width="356" height="265" rx="18" fill="#FFFFFF" stroke="none"/><rect x="633" y="268" width="164.6" height="30" rx="15" fill="#F8E9C9" stroke="none"/><text x="645" y="288" font-size="13" fill="#6A4913" font-weight="600">Incoming checkpoint</text><text x="633" y="330" font-size="23" fill="#272335" font-weight="700">Your PC</text><text x="633" y="363" font-size="16" fill="#655D70" font-weight="400">Oct 17 · 8:32 PM</text><text x="633" y="395" font-size="15" fill="#655D70" font-weight="400">Save bundle · 2 files · 128 KB</text><text x="633" y="429" font-size="15" fill="#285343" font-weight="600">Copy verified</text><text x="633" y="468" font-size="14" fill="#655D70" font-weight="400">Progress details unavailable</text><rect x="244" y="535" width="727" height="116" rx="18" fill="#EEE8F4" stroke="none"/><text x="264" y="565" font-size="18" fill="#272335" font-weight="700">What happens next?</text><text x="264" y="593" font-size="16" fill="#272335" font-weight="400">Doki backs up this handheld’s save before replacement.</text><text x="264" y="621" font-size="16" fill="#272335" font-weight="400">Both save paths remain in your history.</text><rect x="244" y="681" width="320" height="48" rx="14" fill="#7354A3" stroke="none"/><text x="260" y="711" font-size="15" fill="#FFFFFF" font-weight="600">Back up and use PC save</text><rect x="580" y="681" width="215" height="48" rx="14" fill="#EEE8F4" stroke="none"/><text x="596" y="711" font-size="15" fill="#7354A3" font-weight="600">Keep handheld save</text><text x="244" y="762" font-size="14" fill="#655D70" font-weight="400">No automatic merge: these binary saves need a chosen continuation.</text><text x="1084" y="229" font-size="23" fill="#272335" font-weight="700">Choose a continuation</text><text x="1084" y="257" font-size="14" fill="#655D70" font-weight="400">Moonlit Meadow · sample saves</text><rect x="1082" y="280" width="370" height="144" rx="18" fill="#FFFFFF" stroke="none"/><text x="1098" y="312" font-size="20" fill="#272335" font-weight="700">This handheld</text><rect x="1098" y="325" width="142.4" height="30" rx="15" fill="#E2EFE8" stroke="none"/><text x="1110" y="345" font-size="13" fill="#285343" font-weight="600">Current playable</text><text x="1098" y="384" font-size="14" fill="#655D70" font-weight="400">Oct 17 · 8:14 PM · Copy verified</text><rect x="1082" y="440" width="370" height="144" rx="18" fill="#FFFFFF" stroke="none"/><text x="1098" y="472" font-size="20" fill="#272335" font-weight="700">Your PC</text><rect x="1098" y="485" width="164.6" height="30" rx="15" fill="#F8E9C9" stroke="none"/><text x="1110" y="505" font-size="13" fill="#6A4913" font-weight="600">Incoming checkpoint</text><text x="1098" y="544" font-size="14" fill="#655D70" font-weight="400">Oct 17 · 8:32 PM · Copy verified</text><text x="1090" y="617" font-size="16" fill="#272335" font-weight="600">Both saves stay in history.</text><text x="1090" y="644" font-size="14" fill="#655D70" font-weight="400">Your current save is backed up first.</text><rect x="1084" y="667" width="366" height="48" rx="14" fill="#7354A3" stroke="none"/><text x="1100" y="697" font-size="15" fill="#FFFFFF" font-weight="600">Back up and use PC save</text><rect x="1084" y="727" width="366" height="48" rx="14" fill="#EEE8F4" stroke="none"/><text x="1100" y="757" font-size="15" fill="#7354A3" font-weight="600">Keep handheld save</text></g></svg>