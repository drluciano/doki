<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="960" viewBox="0 0 1510 960" role="img" aria-labelledby="title"><title id="title">Doki proposed 04-components.svg static concept with sample data</title><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1510" height="960" rx="0" fill="#FAF7F2" stroke="none"/><text x="40" y="53" font-size="30" fill="#272335" font-weight="700">Doki / proposed component and token gallery</text><text x="40" y="86" font-size="16" fill="#655D70" font-weight="400">Sample data • static design preparation • no approved mockups or production behavior</text><rect x="40" y="120" width="212" height="80" rx="18" fill="#FAF7F2" stroke="#D7CEDD"/><text x="40" y="228" font-size="15" fill="#272335" font-weight="400">Canvas #FAF7F2</text><rect x="280" y="120" width="212" height="80" rx="18" fill="#272335" stroke="#D7CEDD"/><text x="280" y="228" font-size="15" fill="#272335" font-weight="400">Ink #272335</text><rect x="520" y="120" width="212" height="80" rx="18" fill="#655D70" stroke="#D7CEDD"/><text x="520" y="228" font-size="15" fill="#272335" font-weight="400">Muted #655D70</text><rect x="760" y="120" width="212" height="80" rx="18" fill="#7354A3" stroke="#D7CEDD"/><text x="760" y="228" font-size="15" fill="#272335" font-weight="400">Accent #7354A3</text><rect x="1000" y="120" width="212" height="80" rx="18" fill="#E2EFE8" stroke="#D7CEDD"/><text x="1000" y="228" font-size="15" fill="#272335" font-weight="400">Mint #E2EFE8</text><rect x="1240" y="120" width="212" height="80" rx="18" fill="#F8E9C9" stroke="#D7CEDD"/><text x="1240" y="228" font-size="15" fill="#272335" font-weight="400">Attention #F8E9C9</text><text x="40" y="280" font-size="24" fill="#272335" font-weight="700">Type / Segoe UI or native system sans</text><text x="40" y="322" font-size="28" fill="#272335" font-weight="600">Heading · 28/36 · semibold</text><text x="40" y="359" font-size="16" fill="#272335" font-weight="400">Body · 16/24 · Keep your progress, on your terms.</text><text x="40" y="391" font-size="14" fill="#655D70" font-weight="400">Metadata · 14/20 · Device + absolute capture time</text><rect x="40" y="430" width="240" height="48" rx="14" fill="#7354A3" stroke="none"/><text x="56" y="460" font-size="15" fill="#FFFFFF" font-weight="600">Create checkpoint</text><rect x="300" y="430" width="210" height="48" rx="14" fill="#EEE8F4" stroke="none"/><text x="316" y="460" font-size="15" fill="#7354A3" font-weight="600">Review details</text><rect x="530" y="426" width="246" height="56" rx="18" fill="none" stroke="#7354A3"/><rect x="534" y="430" width="238" height="48" rx="14" fill="#7354A3" stroke="none"/><text x="550" y="460" font-size="15" fill="#FFFFFF" font-weight="600">Keyboard focus</text><rect x="800" y="430" width="235" height="48" rx="14" fill="#E5E0E7" stroke="none"/><text x="816" y="460" font-size="15" fill="#655D70" font-weight="400">Unavailable · disabled</text><rect x="40" y="510" width="164.6" height="30" rx="15" fill="#E2EFE8" stroke="none"/><text x="52" y="530" font-size="13" fill="#285343" font-weight="600">✓ Protected locally</text><rect x="260" y="510" width="164.6" height="30" rx="15" fill="#F8E9C9" stroke="none"/><text x="272" y="530" font-size="13" fill="#6A4913" font-weight="600">! Needs your choice</text><rect x="40" y="570" width="650" height="118" rx="18" fill="#FFFFFF" stroke="none"/><text x="60" y="604" font-size="20" fill="#272335" font-weight="700">! Folder access needs updating</text><text x="60" y="634" font-size="16" fill="#655D70" font-weight="400">Your checkpoints remain in the vault.</text><text x="60" y="665" font-size="16" fill="#7354A3" font-weight="600">Reconnect folder  →</text><rect x="730" y="570" width="730" height="118" rx="18" fill="#FFFFFF" stroke="none"/><text x="750" y="603" font-size="18" fill="#272335" font-weight="600">Creating checkpoint · verifying copied bytes</text><rect x="750" y="626" width="680" height="12" rx="6" fill="#EEE8F4" stroke="none"/><rect x="750" y="626" width="390" height="12" rx="6" fill="#7354A3" stroke="none"/><text x="750" y="669" font-size="14" fill="#655D70" font-weight="400">Illustrated measurable progress; no fake percentages.</text><text x="40" y="744" font-size="18" fill="#272335" font-weight="600">Spacing: 4 / 8 / 12 / 16 / 24 / 32     Radius: 14 controls / 18 cards / 24 panels</text><text x="40" y="785" font-size="17" fill="#272335" font-weight="400">48dp targets • visible focus • text + icon status • wrapping layouts at 200% text</text><text x="40" y="823" font-size="17" fill="#272335" font-weight="400">Motion proposal: 160ms control / 220ms panel. Reduced motion: no translation or bounce.</text><text x="40" y="864" font-size="16" fill="#655D70" font-weight="400">Screen readers: named actions + device/time/state; announce final results once. Test, do not assume compliance.</text><text x="40" y="918" font-size="15" fill="#7354A3" font-weight="400">Asset provenance: original SVG shapes and system text; no Cocoon artwork, screenshots, or game assets copied.</text></g></svg>