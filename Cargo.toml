[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[workspace.dependencies]
doki-core = { path = "crates/doki-core" }
doki-vault = { path = "crates/doki-vault" }
doki-platform = { path = "crates/doki-platform" }
doki-engine = { path = "crates/doki-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
getrandom = "0.3"
humantime = "2"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
doki-relay = { path = "crates/doki-relay" }
doki-sync = { path = "crates/doki-sync" }
doki-api = { path = "crates/doki-api" }
doki-peer = { path = "crates/doki-peer" }
jni = "0.21"
tiny_http = "0.12"
ureq = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
