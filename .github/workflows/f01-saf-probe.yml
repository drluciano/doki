name: F01 read-only SAF probe
on:
  pull_request:
    paths:
      - 'tools/f01-saf-probe/**'
      - '.github/workflows/f01-saf-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/f01-saf-probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Provision pinned SDK packages on hosted runner
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK and lint probe only
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:lintDebug
      - name: Upload debug APK (test only)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f01-read-only-probe-debug
          path: tools/f01-saf-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f01-probe-lint
          path: tools/f01-saf-probe/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
