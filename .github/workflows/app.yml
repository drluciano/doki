name: App
on:
  pull_request:
    paths:
      - 'app/**'
      - 'android/bridge/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/app-test.sh'
      - 'tools/build-android-engine.sh'
      - 'tools/check-apk-bridge.sh'
      - 'tools/check-windows-installer.ps1'
      - 'tools/build-flatpak.sh'
      - 'tools/check-flatpak.sh'
      - 'tools/check-linux-desktop.*'
      - '.github/workflows/app.yml'
      - 'tools/android-version-code.sh'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/bridge/**'
      - 'crates/**'
  workflow_dispatch:
  # The release workflow builds through this one, so a release is built and
  # checked exactly like every test build.
  workflow_call:
    inputs:
      release:
        description: Building a release (the Android APK must be signed with Doki's key)
        type: boolean
        default: false
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.47.7'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install Flutter (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build libgtk-3-dev
      - name: Install Flutter (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/flutter.zip" "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_${FLUTTER_VERSION}-stable.zip"
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test (widgets and real engine through FFI)
        run: tools/app-test.sh
      - name: Build desktop app
        working-directory: app
        run: flutter build ${{ runner.os == 'Windows' && 'windows' || 'linux' }} --release
      - name: Bundle the Visual C++ runtime
        # Doki and its engine need the Visual C++ runtime, which a fresh
        # Windows install may lack; ship it next to doki.exe (app-local
        # deployment) instead of asking users to install it.
        if: runner.os == 'Windows'
        run: |
          vs=$(cygpath -u "$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)")
          crt=$(ls -d "$vs"/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT | sort -V | tail -1)
          echo "Using $crt"
          cp "$crt"/msvcp140.dll "$crt"/vcruntime140.dll "$crt"/vcruntime140_1.dll app/build/windows/x64/runner/Release/
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          choco upgrade innosetup -y --no-progress
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$version" app/windows/installer/doki.iss
          ls -l app/build/windows/installer
      - name: Check the installer (install, update over a running Doki, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/check-windows-installer.ps1 (Get-Item app/build/windows/installer/doki-setup-*.exe).FullName
      - name: Upload Windows installer (test build, unsigned)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doki-windows-setup
          path: app/build/windows/installer/doki-setup-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows app (test build)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doki-windows
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  linux:
    # The Flatpak, for x86_64 (Steam Deck, PCs) and aarch64 (ARM handhelds
    # such as the Odin 3 on Armada), each built natively on its own runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            flutter_arch: x64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            flutter_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install build and check tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libgtk-3-dev clang cmake pkg-config \
            flatpak flatpak-builder xvfb xauth dbus python3-gi python3-xlib
          # flatpak-builder sandboxes each build step with bubblewrap, which
          # needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Flutter
        # Flutter publishes SDK archives for x64 Linux only; on arm64 the SDK
        # is checked out at the same version and fetches arm64 tools itself.
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            curl -sSfL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          else
            git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build Linux app
        working-directory: app
        run: flutter build linux --release
      - name: Check the tray, closing to the tray and one Doki at a time
        run: tools/check-linux-desktop.sh app/build/linux/${{ matrix.flutter_arch }}/release/bundle/doki
      - name: Build the Flatpak
        run: tools/build-flatpak.sh
      - name: Check the Flatpak (libraries, start, update in place keeps data)
        run: tools/check-flatpak.sh app/build/doki-linux-${{ matrix.arch }}.flatpak
      - name: Upload Flatpak (test build)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doki-linux-${{ matrix.arch }}
          path: app/build/doki-linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust and Android targets
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: Install Flutter
        run: |
          curl -sSfL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build engine library
        # cargo-ndk finds the runner's NDK through ANDROID_NDK_ROOT.
        run: tools/build-android-engine.sh
      - name: Set up Doki's signing key
        # Every APK signed with the same key installs over the previous one
        # and keeps the app's data (#82). The key lives only in repository
        # secrets; see docs/release.md. Without it, test builds fall back to
        # the debug key, and a release refuses to build.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE: ${{ inputs.release && 'true' || 'false' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::A release needs the ANDROID_KEYSTORE_BASE64 secret (see docs/release.md)"
              exit 1
            fi
            echo "::warning::No Android signing key in this run's secrets; the APK is signed with a throwaway debug key and will not install over other builds"
            exit 0
          fi
          keystore="$RUNNER_TEMP/doki-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "DOKI_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: app
        env:
          DOKI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DOKI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DOKI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # A newer build must have a larger versionCode or Android refuses
        # to install it over the older one.
        run: flutter build apk --release --build-number "$(../tools/android-version-code.sh)"
      - name: Check the APK's signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | tee /tmp/certs.txt
          if [ -n "${DOKI_ANDROID_KEYSTORE:-}" ] && grep -q 'CN=Android Debug' /tmp/certs.txt; then
            echo "::error::The APK is signed with the debug key, not Doki's key"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/doki-release.jks"
      - name: Check the APK carries the engine
        run: |
          unzip -l app/build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk.txt | grep -q 'lib/arm64-v8a/libdoki_jni.so'
          grep -q 'lib/x86_64/libdoki_jni.so' /tmp/apk.txt
      - name: Check the APK keeps the bridge names the engine calls
        run: tools/check-apk-bridge.sh app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doki-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
