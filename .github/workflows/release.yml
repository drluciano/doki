name: Release
# Builds every package through the App workflow (with all its checks), then
# creates a draft GitHub release with the packages, their SHA-256 checksums
# and the version's CHANGELOG.md section. Nothing is public and no tag exists
# until someone opens the draft on GitHub and chooses "Publish release".
# How to make a release: docs/release.md.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main; this run is on ${GITHUB_REF}"
          exit 1
      - name: Check the version is ready (pubspec, AppStream, CHANGELOG)
        id: version
        run: |
          tools/release-notes.sh > /dev/null
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"
      - name: Check v<version> is not released yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists. Raise the version in app/pubspec.yaml (see docs/release.md)."
            exit 1
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/app.yml
    with:
      release: true
    secrets: inherit

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Name the packages and write checksums
        run: |
          mkdir dist
          cp artifacts/doki-windows-setup/doki-setup-*.exe "dist/doki-$VERSION-windows-setup.exe"
          cp artifacts/doki-android/app-release.apk "dist/doki-$VERSION-android.apk"
          cp artifacts/doki-linux-x86_64/doki-linux-x86_64.flatpak "dist/doki-$VERSION-linux-x86_64.flatpak"
          cp artifacts/doki-linux-aarch64/doki-linux-aarch64.flatpak "dist/doki-$VERSION-linux-aarch64.flatpak"
          cd dist && sha256sum doki-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Write the release notes
        run: |
          {
            tools/release-notes.sh "$VERSION"
            echo
            echo '## Downloads'
            echo
            echo '| Device | File |'
            echo '|---|---|'
            echo "| Windows 10 and 11 | \`doki-$VERSION-windows-setup.exe\` |"
            echo "| Android | \`doki-$VERSION-android.apk\` |"
            echo "| Linux, Steam Deck and PCs (x86_64) | \`doki-$VERSION-linux-x86_64.flatpak\` |"
            echo "| Linux, ARM handhelds such as the Odin 3 (aarch64) | \`doki-$VERSION-linux-aarch64.flatpak\` |"
            echo
            echo 'Install and update steps: [Getting started](https://github.com/drluciano/doki/wiki/Getting-Started) and [Updating Doki](https://github.com/drluciano/doki/wiki/Updating-Doki). Check a download with `sha256sum -c SHA256SUMS.txt --ignore-missing`.'
          } > notes.md
          cat notes.md
      - name: Create the draft release
        # A draft creates no tag; publishing it tags this commit as v<version>.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release v$VERSION already exists, maybe as a draft. Delete that draft to rebuild it, or raise the version."
            exit 1
          fi
          prerelease=
          case "$VERSION" in 0.*) prerelease=--prerelease ;; esac
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --target "$GITHUB_SHA" --title "Doki $VERSION" --notes-file notes.md
          echo "Draft release: $(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
